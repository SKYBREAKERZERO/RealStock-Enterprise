[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "realstock-enterprise"
version = "0.1.0"
description = "Enterprise-grade real-time stock market data and risk monitoring platform."
requires-python = ">=3.12,<3.13"

dependencies = [
    "boto3>=1.43,<2",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",

    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.3,<4",

    "redis>=7,<8",

    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",

    "opentelemetry-api>=1.44,<2",
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
]


[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
]


# ============================================================
# setuptools
# ============================================================

[tool.setuptools]
include-package-data = false


[tool.setuptools.packages.find]
where = ["."]

include = [
    "libs*",
    "services*",
]

exclude = [
    "tests*",
    "scripts*",
    "infra*",
    "flink*",
    "config*",
    "database*",
    "frontend*",
    "monitoring*",
]

namespaces = true


# ============================================================
# pytest
# ============================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

python_files = [
    "test_*.py",
    "*_test.py",
]

python_classes = [
    "Test*",
]

python_functions = [
    "test_*",
]

addopts = "-ra --import-mode=importlib"

markers = [
    "unit: tests that do not require external infrastructure",
    "integration: tests that require local infrastructure",
]


# ============================================================
# Ruff
# ============================================================

[tool.ruff]
target-version = "py312"
line-length = 100


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]


# ============================================================
# mypy
# ============================================================

[tool.mypy]
python_version = "3.12"

warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true

check_untyped_defs = true
no_implicit_optional = true